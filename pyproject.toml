[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browse"
version = "0.2.21"
description = "Playwright-backed browser CLI and installable Claude/Codex skills for UI verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright",
]

[project.scripts]
browse = "browse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["browse"]

[tool.hatch.build.targets.wheel.force-include]
"skill" = "skill"
